[package]
name = "minisolr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust port of minisolr, a small Solr stand-in for Open Library development"
license = "MIT"
publish = false

[dependencies]
tantivy = { version = "0.27", default-features = false }
serde_json = { version = "1", default-features = false, features = ["std"] }
unicode-normalization = "0.1"
tiny_http = "0.12"
roxmltree = "0.20"

[lints.rust]
unsafe_code = "forbid"
unknown_lints = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
# newer clippy flags `assert!(x.is_empty())` in tests; the plain form reads fine
assert_is_empty = "allow"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
debug = false
strip = true
panic = "abort"
