services:
  solr:
    environment:
      - SOLR_OPTS=
        -Dsolr.autoSoftCommit.maxTime=1000
        -Dsolr.autoCommit.maxTime=120000
        -Dsolr.max.booleanClauses=30000
        -Dsolr.environment=dev
      - LOCAL_DEV=true
      - SOLR_HEAP=128m
      - GC_TUNE=-XX:+UseSerialGC -XX:+PerfDisableSharedMem -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=64m
